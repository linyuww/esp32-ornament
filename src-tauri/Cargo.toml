[package]
name = "codex-quota-widget"
version = "0.1.0"
description = "A Windows desktop widget for Codex quota status"
authors = ["local"]
edition = "2021"

[lib]
name = "codex_quota_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
quota-core = { path = "../crates/quota-core" }
